services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pharma_rag
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharma_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma -d pharma_rag"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      cheslav-net:
        aliases:
          - pharma-rag-db
          - pr-db

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:18081:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://pharma:${POSTGRES_PASSWORD:-pharma_secret}@pr-db:5432/pharma_rag
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - /opt/pharma-rag/model-cache:/tmp/fastembed_cache
    networks:
      cheslav-net:
        aliases:
          - pharma-rag-backend-1
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - backend
    networks:
      cheslav-net:
        aliases:
          - pharma-rag-frontend-1
    restart: always

volumes:
  pgdata:

networks:
  cheslav-net:
    external: true
